[project]
name = "book_api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=6.0.0", "ruff>=0.15.12", "ty>=0.0.34"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "C", "B", "W"]
