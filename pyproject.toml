[project]
name = "book_api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=6.0.0", "ruff>=0.16.5", "ty>=0.0.75"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "C", "B", "W"]
