[project]
name = "book_api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=6.0.0", "ruff>=0.17.2", "ty>=0.0.92"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "C", "B", "W"]
